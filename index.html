if(t=='area')return`<div class="w"><label>${LB[n]||n}</label><textarea name="${n}" rows="3">${E(v)}</textarea></div>`;
return`<div class="${w}"><label>${LB[n]||n}</label><input name="${n}" type="${t}" value="${E(v)}" ${n=='Project'?'list="pl"':''}>${n=='Project'?'<datalist id="pl">'+PRD().map(x=>`<option>${E(x)}</option>`).join('')+'</datalist>':''}</div>`}
function frm(sh,d,kid){d=d||{};FOTO=fl(d['Foto URL']).map(u=>({u}));if(!d.ID){if(sh=='KUNJUNGAN')d={Tanggal:today(),Status:'Selesai',Tujuan:'Inspeksi Produk'};else d={Status:'Open','Due Date':''}}
$('#md').innerHTML=`<h2>${d.ID?'Ubah':'Tambah'} Data ${sh=='TEMUAN'?'Temuan':'Kunjungan'}</h2><form id="fm" class="fg" onsubmit="return sv(event,'${sh}','${d.ID||''}','${kid||''}')">${F[sh].map(f=>fld(f,d)).join('')}<div class="w" style="display:flex;gap:8px;justify-content:flex-end"><button type="button" class="btn s" onclick="tutup()">Batal</button><button type="button" class="btn" onclick="simpanForm()">Simpan</button></div></form>`;if(sh=='TEMUAN')phr();opn(0)}
function sv(e,sh,id,kid){e.preventDefault();const o={};new FormData($('#fm')).forEach((v,k)=>o[k]=v);if(id)o.ID=id;
if(sh=='TEMUAN'){const k=D.k.find(x=>x.ID==kid)||{};if(!id){o['ID Kunjungan']=kid;o.Client=k.Client}if(o.Feedback&&!id)o['Tgl Feedback']=today()}
if(sh=='TEMUAN'&&id){const old=D.t.find(x=>x.ID==id);if(o.Feedback&&o.Feedback!=old.Feedback)o['Tgl Feedback']=today()}
if(sh=='KUNJUNGAN'&&!o.Client.trim())return toast('Nama client wajib diisi'),false;
if(sh=='TEMUAN'&&!o.Deskripsi.trim())return toast('Deskripsi temuan wajib diisi'),false;
const bt=$('#fm button.btn:last-child');bt.disabled=true;
const fin=()=>google.script.run.withSuccessHandler(()=>{tutup(1);toast('Data berhasil disimpan');load()}).withFailureHandler(x=>{toast('Gagal menyimpan data. Silakan coba kembali.');bt.disabled=false;bt.textContent='Simpan'}).simpan(sh,o);
if(sh!='TEMUAN')return fin(),false;
const urls=[],q=FOTO.slice();
const nx=()=>{const f=q.shift();if(!f){o['Foto URL']=urls.join('|');return fin()}
if(f.u){urls.push(f.u);return nx()}
bt.textContent='Mengunggah foto '+(urls.length+1);
google.script.run.withSuccessHandler(u=>{urls.push(u);nx()}).withFailureHandler(x=>{toast('Foto gagal diunggah. Silakan coba kembali.');bt.disabled=false;bt.textContent='Simpan'}).uploadFoto(f.d,'temuan_'+Date.now()+'.jpg')};
nx();return false}
function tutup(force){if(!force&&DIRTY&&isForm()&&!confirm('Perubahan belum disimpan. Tutup form tanpa menyimpan?'))return;DIRTY=false;$('#ov').classList.remove('on')}
/* Area gelap hanya menutup tampilan detail (bukan form), dan hanya bila klik DIMULAI & SELESAI di area gelap */
$('#ov').addEventListener('pointerdown',e=>{BD=e.target===e.currentTarget});
$('#ov').addEventListener('click',e=>{if(e.target===e.currentTarget&&BD&&!isForm())tutup();BD=false});
$('#md').addEventListener('input',()=>{if(isForm())DIRTY=true});
$('#md').addEventListener('change',()=>{if(isForm())DIRTY=true});
addEventListener('beforeunload',e=>{if(DIRTY&&isForm()){e.preventDefault();e.returnValue=''}});
function simpanForm(){const f=$('#fm');if(!f)return;f.requestSubmit?f.requestSubmit():f.dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}))}
let FOTO=[];const LB={Feedback:'Tindakan Perbaikan (Feedback)',Project:'Project / Produk','Due Date':'Target Penyelesaian',Deskripsi:'Deskripsi Temuan',Kesimpulan:'Kesimpulan Kunjungan'},PRD=()=>D.m.Produk&&D.m.Produk.length?D.m.Produk:['Bucket Excavator','Counterweight Excavator','Vessel Dump Truck','Konstruksi Umum','Lainnya'];
const gid=u=>{const m=String(u).match(/\/d\/([-\w]+)|[?&]id=([-\w]+)/);return m?(m[1]||m[2]):''},th=u=>gid(u)?'https://drive.google.com/thumbnail?id='+gid(u)+'&sz=w500':u,fl=x=>String(x||'').split('|').filter(Boolean);
function fotoW(){return`<div class="w"><label>Dokumentasi Foto Temuan</label><div class="ph" id="ph"></div><input type="file" accept="image/*" multiple onchange="addF(this)" style="margin-top:8px"></div>`}
function phr(){DIRTY=true;$('#ph').innerHTML=FOTO.map((f,i)=>`<div class="pt"><img src="${f.d||E(th(f.u))}" onclick="lb(this.src)"><b onclick="FOTO.splice(${i},1);phr()">×</b></div>`).join('')}
function addF(inp){[...inp.files].forEach(file=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);FOTO.push({d:c.toDataURL('image/jpeg',.78)});phr()};im.src=r.result};r.readAsDataURL(file)});inp.value=''}
function lb(s){$('#lb').innerHTML='<img src="'+s.replace('sz=w500','sz=w1600')+'">';$('#lb').classList.add('on')}

const mg=a=>`<div class="mg">${a.map(([n,v])=>`<div><small>${n}</small><b>${E(v)||'-'}</b></div>`).join('')}</div>`;
function detKj(id){const k=D.k.find(x=>x.ID==id),ts=D.t.filter(x=>x['ID Kunjungan']==id),c=ts.filter(x=>x.Status=='Closed').length,p=ts.length?Math.round(c/ts.length*100):0;
$('#md').innerHTML=`<div class="dh"><div><span class="bd ${cls(k.Status)}">${E(k.Status)}</span><h2>${E(k.Client)}</h2><small class="mu">${E(k.ID)}</small></div><button class="ic" onclick="tutup()" aria-label="Tutup">×</button></div>${mg([['Tanggal',fmtD(k.Tanggal).replace(/&amp;/g,'&')],['Waktu',k['Jam Masuk']+' – '+k['Jam Keluar']+dur(k)],['Peserta',k['Jumlah Peserta']+' orang'],['Tujuan',k.Tujuan],['Project / produk',k.Project],['PIC Client',k['PIC Client']],['PIC MSB',k['PIC MSB']],['Departemen',k.Departemen]])}
<div class="dbx"><small class="mu">Kesimpulan</small>${E(k.Kesimpulan)||'<i>Belum ada kesimpulan</i>'}</div>
<div class="row"><b>Temuan (${ts.length})</b><span class="mu">${c} closed · ${p}%</span></div><div class="bar"><div style="width:${p}%;background:linear-gradient(90deg,#22c55e,#22d3ee)"></div></div>
${ts.map(x=>`<div class="tm" onclick="detTm('${x.ID}')"><span class="bd ${x.Severity}">${E(x.Severity)}</span> <span class="bd ${cls(x.Status)}">${E(x.Status)}</span> <b>${E(x.Kategori)}</b><br>${E(x.Deskripsi)}</div>`).join('')||emp('Belum ada temuan')}
<div class="ac"><button class="btn d x" onclick="hp('KUNJUNGAN','${id}')">Hapus</button><button class="btn s x" onclick='frm("KUNJUNGAN",D.k.find(x=>x.ID=="${id}"))'>Ubah</button><button class="btn s x" onclick="rep('${id}','print')">Cetak</button><button class="btn s x" onclick="rep('${id}','pdf')">Ekspor PDF</button><button class="btn x" onclick='frm("TEMUAN",{},"${id}")'>+ Tambah temuan</button></div>`;opn(1)}
function detTm(id){const x=D.t.find(a=>a.ID==id),ph=fl(x['Foto URL']);
$('#md').innerHTML=`<div class="dh"><div><span class="bd ${x.Severity}">${E(x.Severity)}</span> <span class="bd ${cls(x.Status)}">${E(x.Status)}</span><h2>${E(x.Kategori)} · ${E(x.Area)}</h2><small class="mu">${E(x.ID)}${D.k.some(k=>k.ID==x['ID Kunjungan'])?` · <a href="#" onclick="detKj('${x['ID Kunjungan']}');return false">Lihat kunjungan</a>`:''}</small></div><button class="ic" onclick="tutup()" aria-label="Tutup">×</button></div>
<div class="mg"><div><small>Client</small><b>${E(x.Client)}</b></div><div><small>PIC MSB</small><b>${E(x['PIC MSB'])||'-'}<small class="mu">${E(who(x).j)}${x.Departemen?' · '+E(x.Departemen):''}</small></b></div><div><small>Target penyelesaian</small><b>${tg(x)}</b></div><div><small>Dibuat</small><b>${E(x['Dibuat Pada'])||'-'}</b></div></div>
<div class="dbx"><small class="mu">Deskripsi temuan</small>${E(x.Deskripsi)}</div>${ph.length?`<div class="ph l">${ph.map(u=>`<div class="pt"><img src="${E(th(u))}" onclick="lb(this.src)"></div>`).join('')}</div>`:''}
<div class="dbx ok"><small class="mu">Tindakan perbaikan (feedback) ${x['Tgl Feedback']?'· '+E(x['Tgl Feedback']):''}</small>${E(x.Feedback)||'<i>Belum ada tindakan perbaikan</i>'}</div>
<div class="ac"><button class="btn d x" onclick="hp('TEMUAN','${id}')">Hapus</button>${x.Status!='Closed'?`<button class="btn s x" onclick="qs('${id}','Closed');tutup()">Tandai closed</button>`:''}<button class="btn x" onclick='frm("TEMUAN",D.t.find(a=>a.ID=="${id}"),"${x["ID Kunjungan"]}")'>Ubah / isi tindakan</button></div>`;opn(1)}
function hp(sh,id){if(!confirm('Hapus data ini'+(sh=='KUNJUNGAN'?' beserta semua temuannya':'')+'?'))return;google.script.run.withSuccessHandler(()=>{tutup(1);toast('Data berhasil dihapus');load()}).withFailureHandler(e=>toast('Gagal menghapus data. Silakan coba kembali.')).hapus(sh,id)}

const rng=()=>{const a=$('#d1').value,b=$('#d2').value,c=$('#rc').value;return D.k.filter(x=>(!a||x.Tanggal>=a)&&(!b||x.Tanggal<=b)&&(!c||x.Client==c)&&(!$('#rd').value||x.Departemen==$('#rd').value))};
function lpv(){const ks=rng(),ids=ks.map(x=>x.ID),ts=D.t.filter(x=>ids.includes(x['ID Kunjungan']));$('#lpv').innerHTML=`<b>${ks.length}</b> kunjungan · <b>${ts.length}</b> temuan · <b>${ts.filter(x=>x.Status=='Closed').length}</b> closed · <b>${ts.filter(x=>fl(x['Foto URL']).length).length}</b> berfoto`}
function pr(n){$('#d1').value=n<0?'':n==0?today().slice(0,8)+'01':new Date(Date.now()+7*36e5-n*864e5).toISOString().slice(0,10);$('#d2').value='';lpv()}
function lp(){const cs=[...new Set(D.k.map(k=>k.Client))].sort();return`<div class="card" style="max-width:820px;margin:0 auto"><h3>Laporan kunjungan client</h3><p class="mu">Pilih periode dan client, lalu cetak atau simpan sebagai PDF. Laporan memuat temuan, foto, dan tindakan perbaikan.</p><div class="chips"><button class="cp" onclick="pr(0)">Bulan ini</button><button class="cp" onclick="pr(30)">30 hari terakhir</button><button class="cp" onclick="pr(-1)">Semua data</button></div><div class="fg"><div><label>Dari tanggal</label><input type="date" id="d1" onchange="lpv()"></div><div><label>Sampai tanggal</label><input type="date" id="d2" onchange="lpv()"></div><div class="w"><label>Client</label><select id="rc" onchange="lpv()"><option value="">Semua client</option>${cs.map(c=>`<option>${E(c)}</option>`).join('')}</select></div><div class="w"><label>Departemen PIC MSB</label><select id="rd" onchange="lpv()"><option value="">Semua departemen</option>${DEP().map(x=>`<option>${E(x)}</option>`).join('')}</select></div></div><div class="pv" id="lpv"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn s" onclick="rep('','print')">Cetak</button><button class="btn" onclick="rep('','pdf')">Ekspor PDF</button></div></div>`}
function rep(kid,mode){let ks;if(kid)ks=D.k.filter(x=>x.ID==kid);else{const a=$('#d1').value,b=$('#d2').value,c=$('#rc').value;ks=D.k.filter(x=>(!a||x.Tanggal>=a)&&(!b||x.Tanggal<=b)&&(!c||x.Client==c)&&(!$('#rd').value||x.Departemen==$('#rd').value))}
if(!ks.length)return toast('Tidak ada data pada periode yang dipilih');ks.sort((a,b)=>String(a.Tanggal).localeCompare(b.Tanggal));
const ids=ks.map(x=>x.ID),ts=D.t.filter(x=>ids.includes(x['ID Kunjungan'])),cl=ts.filter(x=>x.Status=='Closed').length,cr=ts.filter(x=>x.Severity=='Critical').length,fb=ts.filter(x=>x.Feedback).length;
const ttl=kid?'Laporan Kunjungan - '+ks[0].Client+' - '+ks[0].Tanggal:'Rekap Kunjungan Client';
const sec=k=>{const t=D.t.filter(x=>x['ID Kunjungan']==k.ID);return`<div class="vs"><h3>${E(k.Client)} <small>${E(k.ID)}</small></h3><table class="in"><tr><td>Tanggal</td><td>${E(k.Tanggal)} (${E(k['Jam Masuk'])}–${E(k['Jam Keluar'])})</td><td>PIC Client</td><td>${E(k['PIC Client'])} · ${E(k['Jumlah Peserta'])} peserta</td></tr><tr><td>Tujuan</td><td>${E(k.Tujuan)}</td><td>Project/Produk</td><td>${E(k.Project)}</td></tr><tr><td>PIC MSB</td><td>${E(k['PIC MSB'])}${k.Departemen?' · '+E(k.Departemen):''}</td><td>Status</td><td>${E(k.Status)}</td></tr><tr><td>Kesimpulan</td><td colspan="3">${E(k.Kesimpulan)||'-'}</td></tr></table><table class="tb"><tr><th>No</th><th>Kategori / Area</th><th>Temuan Client</th><th>Severity</th><th>Tindakan Perbaikan (Feedback)</th><th>PIC</th><th>Target</th><th>Status</th></tr>${t.map((x,i)=>`<tr><td>${i+1}</td><td>${E(x.Kategori)}<br><i>${E(x.Area)}</i></td><td>${E(x.Deskripsi)}<div class="im">${fl(x['Foto URL']).map(u=>`<img src="${E(th(u))}">`).join('')}</div></td><td><b class="s${x.Severity}">${E(x.Severity)}</b></td><td>${E(x.Feedback)||'<i>Belum ada tindakan</i>'}${x['Tgl Feedback']?'<br><i>'+E(x['Tgl Feedback'])+'</i>':''}</td><td>${E(x['PIC MSB'])}${x.Departemen?'<br><i>'+E(x.Departemen)+'</i>':''}</td><td>${E(x['Due Date'])}</td><td>${E(x.Status)}</td></tr>`).join('')||'<tr><td colspan="8" align="center">Tidak ada temuan</td></tr>'}</table></div>`};
const css=`@page{size:A4 landscape;margin:11mm}*{box-sizing:border-box}body{font:11px Arial,sans-serif;color:#0f172a;margin:0}.hd{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #0d3f94;padding-bottom:8px}.hd img{height:46px}.hd h1{margin:0;font-size:17px;color:#0d3f94;text-align:right}.hd p{margin:2px 0 0;text-align:right;color:#64748b}.kp{display:flex;gap:8px;margin:10px 0}.kp div{flex:1;border:1px solid #d5deee;border-left:4px solid #0d3f94;padding:6px 9px;border-radius:5px}.kp b{font-size:17px;display:block}.vs{margin-top:12px}.vs h3{margin:0 0 5px;font-size:13px;color:#0d3f94;background:#eaf0fb;padding:5px 8px;border-radius:4px}.vs h3 small{color:#64748b;font-weight:400;float:right}table{width:100%;border-collapse:collapse}.in td{padding:3px 6px;border:1px solid #e2e8f0}.in td:nth-child(odd){background:#f8fafc;font-weight:700;width:12%}.tb{margin-top:6px}.tb th{background:#0d3f94;color:#fff;padding:5px;font-size:10px;text-align:left}.tb td{border:1px solid #cbd5e1;padding:4px 5px;vertical-align:top}.tb tr{break-inside:avoid}.im img{height:62px;margin:4px 4px 0 0;border:1px solid #cbd5e1;border-radius:3px}.sCritical{color:#b91c1c}.sMajor{color:#b45309}.sMinor{color:#1d4ed8}.sg{display:flex;gap:12px;margin-top:22px;break-inside:avoid}.sg div{flex:1;text-align:center;border-top:1px solid #0f172a;padding-top:4px;margin-top:46px}.ft{margin-top:12px;color:#94a3b8;font-size:9px;border-top:1px solid #e2e8f0;padding-top:4px}`;
const per=kid?E(ks[0].Tanggal):E(ks[0].Tanggal)+' s/d '+E(ks[ks.length-1].Tanggal);
const doc=`<!DOCTYPE html><html><head><meta charset="utf-8"><title>${E(ttl)}</title><style>${css}</style></head><body><div class="hd"><img src="${LOGO}"><div><h1>${kid?'LAPORAN KUNJUNGAN CLIENT':'REKAP KUNJUNGAN CLIENT'}</h1><p>Periode: ${per} · Dicetak: ${today()}</p></div></div><div class="kp"><div><b>${ks.length}</b>Kunjungan</div><div><b>${ts.length}</b>Total Temuan</div><div><b>${fb}</b>Sudah Ada Tindakan</div><div><b>${cl}</b>Closed</div><div><b>${ts.length-cl}</b>Belum Closed</div><div><b>${cr}</b>Critical</div></div>${ks.map(sec).join('')}<div class="sg"><div>Dibuat oleh<br>${kid?E(ks[0]['PIC MSB'])+'<br>':''}(PIC MSB)</div><div>Diperiksa<br>(QC / HSE)</div><div>Disetujui<br>(Management)</div><div>Diterima Client</div></div><div class="ft">PT Murinda Sentra Baja · Dokumen dihasilkan oleh Sistem Manajemen Kunjungan Client</div></body></html>`;
const w=window.open('','_blank');if(!w)return toast('Aktifkan pop-up pada browser untuk mencetak laporan');w.document.write(doc);w.document.close();
if(mode=='pdf')toast('Pilih "Simpan sebagai PDF" pada dialog cetak');
Promise.all([...w.document.images].map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r}))).then(()=>setTimeout(()=>w.print(),400))}

load(1);
</script></body></html>
